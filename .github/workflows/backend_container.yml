name: Build Backend Container

on:
  push:
    paths:
      - 'Backend/**'

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts
        working-directory: ./Backend

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.BACKEND_DOCKER_USERNAME }}
          password: ${{ secrets.BACKEND_DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker buildx build -t ${{ secrets.BACKEND_DOCKER_USERNAME }}/kinderbuch-backend:latest ./Backend

      - name: Push Docker imagegit 
        run: docker push ${{ secrets.BACKEND_DOCKER_USERNAME }}/kinderbuch-backend:latest